<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Matchmaking · Score heatmap</title>
  <style>
    :root{--bg:#f5f7fa;--surface:#fff;--ink:#192635;--muted:#617084;--line:#dee4ea;--blue:#245bb2;--red:#a51e35;--redbg:#ffe1e5;--yellow:#745100;--yellowbg:#ffedb4;--green:#116b41;--greenbg:#dcf4e6;--gray:#6f7b8c;--graybg:#edf0f3}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,Segoe UI,sans-serif}
    button,input,select{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}h1{font-size:18px}h2{font-size:14px}h3{font-size:13px}.muted{color:var(--muted)}.small{font-size:11px}.mono{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
    header{background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,calc((100vw - 1760px)/2))}
    .top{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    .heading{min-width:0}.heading .muted{font-size:11px;overflow-wrap:anywhere}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar label{color:var(--muted)}
    button.action{background:var(--blue);border:1px solid var(--blue);color:white;padding:6px 12px;border-radius:6px}.action:disabled{opacity:.5}
    .stats{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.stat{background:#f3f6fa;border:1px solid var(--line);border-radius:5px;padding:4px 9px}.stat b{font-variant-numeric:tabular-nums}
    .stats .score-stat{display:inline-flex;align-items:center;gap:6px;font-weight:500;min-height:0;padding:4px 9px}
    .stats .score-stat.hard{background:var(--redbg);color:var(--red);border-color:#edb2bd}
    .stats .score-stat.soft{background:var(--yellowbg);color:var(--yellow);border-color:#ecd082}
    .stats .score-stat.clean{background:var(--greenbg);color:var(--green);border-color:#b3dfc9}
    .stats .score-stat.unknown{background:var(--graybg);color:var(--gray);border-color:#dce1e6}
    .score-summary{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:8px 0 10px}
    .score-summary .entity{cursor:default}.score-summary .entity:hover{outline:none}
    .score-summary .score-help{font-size:11px;color:var(--muted)}
    main{max-width:1800px;margin:auto;padding:12px 16px 35px;display:grid;grid-template-columns:minmax(0,1fr) 360px;align-items:start;gap:12px}
    .pane{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
    .pane-head{padding:9px 11px;display:flex;align-items:center;gap:9px;justify-content:space-between;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.filters input{width:200px;max-width:40vw}.filters input,.filters select{border:1px solid #c9d2dd;background:white;padding:5px 8px;border-radius:5px;color:var(--ink)}
    .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:4px}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;border:1px solid #0002}
    .dot.hard{background:#cb3348}.dot.soft{background:#e1ac15}.dot.clean{background:#2ea16b}.dot.unknown{background:#9aa4af}
    .list-head,.team-row{display:grid;grid-template-columns:112px 110px 112px minmax(250px,1fr);gap:7px;align-items:start}
    .list-head{background:#f5f8fb;color:var(--muted);font-size:11px;padding:6px 11px;border-bottom:1px solid var(--line)}
    .team-row{padding:6px 11px;border-bottom:1px solid #edf0f3;min-height:39px}.team-row:hover{background:#fbfcff}.team-row:last-child{border-bottom:0}
    .entity{display:inline-flex;gap:5px;align-items:center;padding:3px 6px;border:1px solid transparent;border-radius:5px;max-width:100%;text-align:left;min-height:25px;overflow-wrap:anywhere}
    .entity.hard{background:var(--redbg);color:var(--red);border-color:#edb2bd}
    .entity.soft{background:var(--yellowbg);color:var(--yellow);border-color:#ecd082}
    .entity.clean{background:var(--greenbg);color:var(--green);border-color:#b3dfc9}
    .entity.unknown{background:var(--graybg);color:#505c6b;border-color:#dce1e6}
    .entity:hover,.entity:focus-visible{outline:2px solid #6a98eb;outline-offset:1px}.entity.selected{outline:2px solid #2a60aa;outline-offset:1px}
    .team-id{font-weight:700}.team-meta{font-size:11px;color:var(--muted);margin-top:3px}.team-opponent{font-size:12px;color:var(--muted);padding-top:5px;overflow-wrap:anywhere}
    .team-numbers{font-size:12px;padding-top:4px;white-space:nowrap}.roles-line{font-size:11px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
    .players{display:flex;flex-wrap:wrap;gap:4px}.player-chip{font-size:11px;white-space:nowrap;min-height:24px}.player-chip .role{opacity:.72;font-size:10px}
    .waiting{padding:8px 11px;border-top:1px solid var(--line)}.waiting .players{margin-top:6px}
    aside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}.section{padding:10px 12px;border-bottom:1px solid var(--line)}.section:last-child{border:0}
    .analysis-row{display:flex;justify-content:space-between;gap:9px;border-bottom:1px solid #f0f1f4;padding:6px 0;align-items:center}
    .analysis-row:last-child{border:0}.analysis-row button{background:none;border:0;padding:0;text-align:left;color:var(--blue);overflow-wrap:anywhere}.analysis-row button:hover{text-decoration:underline}.analysis-row .mono{white-space:nowrap;font-size:11px}
    .pill{font-size:11px;border-radius:4px;padding:2px 5px;background:#eef2f7;color:#405671;display:inline-block}
    .notice{padding:9px 12px;background:#fff7df;color:#665010;border-bottom:1px solid #e9d8a4;overflow-wrap:anywhere}.notice.error{background:#ffebec;color:#87233a;border-color:#efc2cc}
    .empty{color:var(--muted);padding:10px 0;font-size:12px}.match{border-top:1px solid var(--line);padding:7px 0;font-size:12px}.match pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:170px;overflow:auto;font:11px/1.35 ui-monospace,Consolas,monospace;color:#4e5a66;margin:4px 0 0}
    details>summary{cursor:pointer;color:var(--blue);padding:5px 0}.score-hard{color:var(--red)}.score-soft{color:var(--yellow)}
    [hidden]{display:none!important}
    @media(max-width:1180px){main{grid-template-columns:1fr}aside{position:static;max-height:none}.list-head,.team-row{grid-template-columns:98px 96px 108px minmax(230px,1fr)}}
    @media(max-width:700px){.list-head{display:none}.team-row{grid-template-columns:1fr 1fr;gap:5px}.team-row .players{grid-column:1/-1}.team-opponent{padding:2px 0}.team-numbers{padding:2px 0}.filters input{width:150px}}
  </style>
</head>
<body>
<header>
  <div class="top">
    <div class="heading"><h1>Matchmaking · score heatmap</h1><p class="muted" id="game-name">Loading…</p></div>
    <div class="toolbar"><label><input id="auto-refresh" type="checkbox"> Auto refresh (3 s)</label><button class="action" id="refresh-btn">Refresh</button></div>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <section class="pane" aria-label="Team overview">
    <div id="error" class="notice error" hidden></div>
    <div class="pane-head">
      <div class="filters"><strong>Teams <span id="visible-count" class="muted"></span></strong>
        <input id="search" type="search" placeholder="Find team, player, party…" aria-label="Filter by team or player">
        <select id="severity-filter" aria-label="Filter teams by contribution"><option value="all">All scores</option><option value="hard">Has hard penalty</option><option value="soft">Has soft penalty</option><option value="clean">No contribution</option><option value="unknown">Unknown</option></select>
        <select id="sort-order" aria-label="Sort teams"><option value="natural">Original order</option><option value="severity">Hard → soft → clean</option><option value="name">Team name</option></select>
      </div>
      <div class="legend"><span><i class="dot hard"></i>Hard</span><span><i class="dot soft"></i>Soft</span><span><i class="dot clean"></i>None</span><span><i class="dot unknown"></i>Unknown</span></div>
    </div>
    <div class="list-head"><span>Team</span><span>Opponent</span><span>Size / rating</span><span>Players (click for contribution)</span></div>
    <div id="team-list"><p class="empty" style="padding:12px">Loading teams…</p></div>
    <div class="waiting" id="waiting" hidden><strong>Unassigned players <span class="muted" id="waiting-count"></span></strong><div class="players" id="waiting-players"></div></div>
  </section>
  <aside class="pane" aria-label="Score analysis">
    <div class="section"><div class="legend" id="analysis-status">Waiting for ScoreAnalysis…</div><div id="analysis-warning" class="notice" hidden></div></div>
    <section class="section" id="detail-panel">
      <h2 id="detail-heading">Selected object</h2>
      <div id="entity-details" class="empty">Select a team or player to view Timefold contributions.</div>
      <div id="total-details" hidden>
        <div id="total-score-summary" class="score-summary"></div>
        <div id="constraint-list" class="empty">Loading…</div>
        <div id="constraint-details"></div>
      </div>
    </section>
    <section class="section" id="other-contributors" hidden><h2>Other indicted objects</h2><div class="players" id="other-list" style="margin-top:7px"></div></section>
  </aside>
</main>
<script src="/game.js" defer></script>
</body>
</html>
